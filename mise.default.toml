[dotfiles."~/.agents"]
source = "config/.agents"
mode = "symlink-each"
manifest = "git"
exclude = ["skills"]

[dotfiles."~/.claude"]
source = "config/.claude"
mode = "symlink-each"
manifest = "git"
exclude = ["skills"]

[dotfiles."~/.codex"]
source = "config/.codex"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.config"]
source = "config/.config"
mode = "symlink-each"
manifest = "git"
exclude = ["tests", "*.example", "mise", "karabiner"]

[dotfiles."~/.gemini"]
source = "config/.gemini"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.hermes"]
source = "config/.hermes"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.pi"]
source = "config/.pi"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.agents/skills/[!.]*"]
source = "config/.agents/skills/[!.]*"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.claude/skills/[!.]*"]
source = "config/.agents/skills/[!.]*"
mode = "symlink-each"
manifest = "git"

