[dotfiles]
# General config
"~/.config" = { source = "config/.config", mode = "symlink-each", manifest = "git", exclude = ["*.example", "mise", "karabiner"] }
"~/.config/mise/config.toml" = "config/.config/mise/config.base.toml"
"~/.config/karabiner" = "config/.config/karabiner"
"~/.hammerspoon" = { source = "config/.hammerspoon", mode = "symlink-each", manifest = "git" }
"~/.vimrc" = "config/.vimrc"

# fish and Yazi plugins cloned by [bootstrap.repos]
"~/.config/fish/plugins/*" = "~/.local/share/fish-plugins/*"
"~/.config/yazi/plugins/git.yazi" = "~/.local/share/yazi-plugins/git.yazi"
"~/.config/yazi/plugins/smart-enter.yazi" = "~/.local/share/yazi-plugins/smart-enter.yazi"
"~/.config/yazi/plugins/full-border.yazi" = "~/.local/share/yazi-plugins/full-border.yazi"

# Agent config
"~/.agents" = { source = "config/.agents", mode = "symlink-each", manifest = "git", exclude = ["skills"] }
"~/.claude" = { source = "config/.claude", mode = "symlink-each", manifest = "git", exclude = ["skills"] }
"~/.codex" = { source = "config/.codex", mode = "symlink-each", manifest = "git" }
"~/.gemini" = { source = "config/.gemini", mode = "symlink-each", manifest = "git" }
"~/.pi" = { source = "config/.pi", mode = "symlink-each", manifest = "git" }
"~/.t3/userdata/settings.json" = "config/.t3/userdata/settings.json"

# Shared agent instructions
"~/.claude/CLAUDE.md" = "config/.agents/AGENTS.md"
"~/.codex/AGENTS.md" = "config/.agents/AGENTS.md"
"~/.config/opencode/AGENTS.md" = "config/.agents/AGENTS.md"
"~/.gemini/GEMINI.md" = "config/.agents/AGENTS.md"
"~/.pi/agent/AGENTS.md" = "config/.agents/AGENTS.md"

# Self-made skills; dot-prefixed directories such as .disabled stay undeployed
"~/.agents/skills/[!.]*" = { source = "config/.agents/skills/[!.]*", mode = "symlink-each", manifest = "git" }
"~/.claude/skills/[!.]*" = { source = "config/.agents/skills/[!.]*", mode = "symlink-each", manifest = "git" }

# External skills cloned by [bootstrap.repos]: shared location
"~/.agents/skills/agent-browser" = "~/.local/share/agent-skill-sources/agent-browser/skills/agent-browser"
"~/.agents/skills/agent-device" = "~/.local/share/agent-skill-sources/agent-device/skills/agent-device"
"~/.agents/skills/cognitive-rhythm-writing" = "~/.local/share/agent-skill-sources/tech-writing/skills/cognitive-rhythm-writing"
"~/.agents/skills/cua-driver" = "~/.local/share/agent-skill-sources/cua-driver/libs/cua-driver/rust/Skills/cua-driver"
"~/.agents/skills/cua-spaces" = "~/.local/share/agent-skill-sources/cua-driver/libs/cua/skills/cua-spaces"
"~/.agents/skills/find-docs" = "~/.local/share/agent-skill-sources/find-docs/skills/find-docs"
"~/.agents/skills/ghostwriter" = "~/.local/share/agent-skill-sources/ghostwriter/skills/ghostwriter"
"~/.agents/skills/japanese-tech-writing" = "~/.local/share/agent-skill-sources/tech-writing/skills/japanese-tech-writing"
"~/.agents/skills/readme-i18n" = "~/.local/share/agent-skill-sources/readme-i18n/skills/readme-i18n"
"~/.agents/skills/skill-creator" = "~/.local/share/agent-skill-sources/skill-creator/skills/skill-creator"
"~/.agents/skills/stop-slop" = "~/.local/share/agent-skill-sources/stop-slop"
"~/.agents/skills/stop-slop-ja" = "~/.local/share/agent-skill-sources/stop-slop-ja"
"~/.agents/skills/tdd" = "~/.local/share/agent-skill-sources/tdd/skills/engineering/tdd"

# External skills: Claude Code
"~/.claude/skills/agent-browser" = "~/.local/share/agent-skill-sources/agent-browser/skills/agent-browser"
"~/.claude/skills/agent-device" = "~/.local/share/agent-skill-sources/agent-device/skills/agent-device"
"~/.claude/skills/cognitive-rhythm-writing" = "~/.local/share/agent-skill-sources/tech-writing/skills/cognitive-rhythm-writing"
"~/.claude/skills/cua-driver" = "~/.local/share/agent-skill-sources/cua-driver/libs/cua-driver/rust/Skills/cua-driver"
"~/.claude/skills/cua-spaces" = "~/.local/share/agent-skill-sources/cua-driver/libs/cua/skills/cua-spaces"
"~/.claude/skills/find-docs" = "~/.local/share/agent-skill-sources/find-docs/skills/find-docs"
"~/.claude/skills/ghostwriter" = "~/.local/share/agent-skill-sources/ghostwriter/skills/ghostwriter"
"~/.claude/skills/japanese-tech-writing" = "~/.local/share/agent-skill-sources/tech-writing/skills/japanese-tech-writing"
"~/.claude/skills/readme-i18n" = "~/.local/share/agent-skill-sources/readme-i18n/skills/readme-i18n"
"~/.claude/skills/skill-creator" = "~/.local/share/agent-skill-sources/skill-creator/skills/skill-creator"
"~/.claude/skills/stop-slop" = "~/.local/share/agent-skill-sources/stop-slop"
"~/.claude/skills/stop-slop-ja" = "~/.local/share/agent-skill-sources/stop-slop-ja"
"~/.claude/skills/tdd" = "~/.local/share/agent-skill-sources/tdd/skills/engineering/tdd"

# Antigravity CLI reads the shared skills
"~/.gemini/antigravity-cli/skills" = "~/.agents/skills"

[bootstrap.repos]
# fish and Yazi plugins
"~/.local/share/fish-plugins/bobthefish" = { url = "https://github.com/oh-my-fish/theme-bobthefish.git", ref = "master" }
"~/.local/share/fish-plugins/fzf" = { url = "https://github.com/jethrokuan/fzf.git", ref = "master" }
"~/.local/share/yazi-plugins" = { url = "https://github.com/yazi-rs/plugins.git", ref = "main" }

# External skill sources
"~/.local/share/agent-skill-sources/agent-browser" = { url = "https://github.com/vercel-labs/agent-browser.git", ref = "main" }
"~/.local/share/agent-skill-sources/agent-device" = { url = "https://github.com/callstack/agent-device.git", ref = "main" }
"~/.local/share/agent-skill-sources/cua-driver" = { url = "https://github.com/trycua/cua.git", ref = "main" }
"~/.local/share/agent-skill-sources/find-docs" = { url = "https://github.com/upstash/context7.git", ref = "master" }
"~/.local/share/agent-skill-sources/ghostwriter" = { url = "https://github.com/mblode/agent-skills.git", ref = "main" }
"~/.local/share/agent-skill-sources/readme-i18n" = { url = "https://github.com/xixu-me/skills.git", ref = "main" }
"~/.local/share/agent-skill-sources/skill-creator" = { url = "https://github.com/anthropics/skills.git", ref = "main" }
"~/.local/share/agent-skill-sources/stop-slop" = { url = "https://github.com/hardikpandya/stop-slop.git", ref = "main" }
"~/.local/share/agent-skill-sources/stop-slop-ja" = { url = "https://github.com/kyaukyuai/stop-slop-ja.git", ref = "main" }
"~/.local/share/agent-skill-sources/tdd" = { url = "https://github.com/mattpocock/skills.git", ref = "main" }
"~/.local/share/agent-skill-sources/tech-writing" = { url = "https://github.com/f4ah6o/tech-write-ja.git", ref = "main" }

[bootstrap.macos.defaults."NSGlobalDomain"]
"AppleEnableSwipeNavigateWithScrolls" = true
"AppleInterfaceStyleSwitchesAutomatically" = true
"AppleKeyboardUIMode" = 2
"ApplePressAndHoldEnabled" = false
"AppleShowAllExtensions" = true
"AppleShowScrollBars" = "WhenScrolling"
"InitialKeyRepeat" = 15
"KeyRepeat" = 2
"NSAutomaticCapitalizationEnabled" = false
"NSAutomaticDashSubstitutionEnabled" = false
"NSAutomaticPeriodSubstitutionEnabled" = false
"NSAutomaticQuoteSubstitutionEnabled" = false
"NSAutomaticSpellingCorrectionEnabled" = false
"NSTableViewDefaultSizeMode" = 2
"com.apple.keyboard.fnState" = true
"AppleLanguages" = ["ja-JP", "en-JP"]
"AppleLocale" = "ja_JP"
"WebAutomaticSpellingCorrectionEnabled" = false

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
"ShowDate" = 0
"ShowDayOfWeek" = true

[bootstrap.macos.defaults."com.apple.dock"]
"autohide" = true
"autohide-delay" = 0.0
"autohide-time-modifier" = 0.0
"expose-group-apps" = true
"mru-spaces" = false
"persistent-apps" = [
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Spark Desktop.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/1Password.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/CleanArchiver.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Google Chrome.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Slack.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Notion Calendar.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Bear.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/CotEditor.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Figma.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Figma Beta.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Ghostty.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Zed.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Users/ryo.nakae/Applications/Chrome Apps.localized/X.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Users/ryo.nakae/Applications/Chrome Apps.localized/Bluesky.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/Spotify.app", "_CFURLStringType" = 0 } } },
  { "tile-data" = { "file-data" = { "_CFURLString" = "/Applications/LINE.app", "_CFURLStringType" = 0 } } },
]
"persistent-others" = [
  { "tile-data" = { "arrangement" = 1, "displayas" = 1, "file-data" = { "_CFURLString" = "file:///Applications", "_CFURLStringType" = 15 }, "showas" = 0 }, "tile-type" = "directory-tile" },
  { "tile-data" = { "arrangement" = 2, "displayas" = 1, "file-data" = { "_CFURLString" = "file:///Users/ryo.nakae/Downloads", "_CFURLStringType" = 15 }, "showas" = 1 }, "tile-type" = "directory-tile" },
]
"show-recents" = false
"showAppExposeGestureEnabled" = true
"showMissionControlGestureEnabled" = true
"wvous-bl-corner" = 3
"wvous-br-corner" = 4
"wvous-tl-corner" = 2
"wvous-tr-corner" = 12
"wvous-bl-modifier" = 0
"wvous-br-modifier" = 0
"wvous-tl-modifier" = 0
"wvous-tr-modifier" = 0

[bootstrap.macos.defaults."com.apple.finder"]
"FXDefaultSearchScope" = "SCcf"
"FXPreferredViewStyle" = "Nlsv"
"NewWindowTarget" = "PfHm"
"ShowPathbar" = true
"ShowStatusBar" = true
"_FXSortFoldersFirst" = true
"_FXSortFoldersFirstOnDesktop" = true

# Built-in trackpad and Magic Trackpad read separate domains.
# Three-finger horizontal swipes are left to Hammerspoon for tab switching.
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
"TrackpadFourFingerHorizSwipeGesture" = 2
"TrackpadFourFingerVertSwipeGesture" = 2
"TrackpadThreeFingerHorizSwipeGesture" = 0
"TrackpadThreeFingerVertSwipeGesture" = 1

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
"TrackpadFourFingerHorizSwipeGesture" = 2
"TrackpadFourFingerVertSwipeGesture" = 2
"TrackpadThreeFingerHorizSwipeGesture" = 0
"TrackpadThreeFingerVertSwipeGesture" = 1

[bootstrap.macos.defaults."com.apple.screensaver"]
"askForPassword" = true
"askForPasswordDelay" = 0
"idleTime" = 600

[bootstrap.macos.defaults."com.apple.universalaccess"]
"closeViewScrollWheelToggle" = true

[bootstrap.macos.defaults."com.apple.desktopservices"]
"DSDontWriteNetworkStores" = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
"EnableTilingByEdgeDrag" = false
"EnableTopTilingByEdgeDrag" = false

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "BatteryShowPercentage"
host = "current"
value = true

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.controlcenter"
key = "Sound"
host = "current"
value = 18

# System Settings mirrors the three-finger page swipe here as well.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.threeFingerHorizSwipeGesture"
host = "current"
value = 0

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.trackpad.threeFingerVertSwipeGesture"
host = "current"
value = 1

# Mission Control: ctrl+q
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["32"]
value = { enabled = true, value = { type = "standard", parameters = [113, 12, 262144] } }

# Application windows: ctrl+w
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["33"]
value = { enabled = true, value = { type = "standard", parameters = [119, 13, 262144] } }

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"
