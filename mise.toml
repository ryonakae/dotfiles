[dotfiles."~/.agents"]
source = "config/.agents"
mode = "symlink-each"
manifest = "git"
exclude = ["skills"]

[dotfiles."~/.claude"]
source = "config/.claude"
mode = "symlink-each"
manifest = "git"
exclude = ["skills"]

[dotfiles."~/.codex"]
source = "config/.codex"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.config"]
source = "config/.config"
mode = "symlink-each"
manifest = "git"
exclude = [
  "tests", "*.example",
  "mise", "karabiner", "agent-safehouse/safe-hermes-*.sh",
]

[dotfiles."~/.gemini"]
source = "config/.gemini"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.hermes"]
source = "config/.hermes"
mode = "symlink-each"
manifest = "git"
exclude = ["*.example"]

[dotfiles."~/.pi"]
source = "config/.pi"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/Dev/local"]
source = "config/Dev/local"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.agents/skills/[!.]*"]
source = "config/.agents/skills/[!.]*"
mode = "symlink-each"
manifest = "git"

[dotfiles."~/.claude/skills/[!.]*"]
source = "config/.agents/skills/[!.]*"
mode = "symlink-each"
manifest = "git"

[dotfiles]
"~/.local/bin/rm" = { source = "config/.local/bin/rm", mode = "symlink" }
"~/.vimrc" = { source = "config/.vimrc", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "config/.agents/AGENTS.md", mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "config/.agents/AGENTS.md", mode = "symlink" }
"~/.config/opencode/AGENTS.md" = { source = "config/.agents/AGENTS.md", mode = "symlink" }
"~/.gemini/GEMINI.md" = { source = "config/.agents/AGENTS.md", mode = "symlink" }
"~/.pi/agent/AGENTS.md" = { source = "config/.agents/AGENTS.md", mode = "symlink" }
"~/Dev/local/.pi/AGENTS.md" = { source = "config/.agents/AGENTS.md", mode = "symlink" }
"~/Dev/local/.pi/APPEND_SYSTEM.md" = { source = "config/.pi/agent/APPEND_SYSTEM.md", mode = "symlink" }
"~/Dev/local/.pi/mcp.json" = { source = "config/.pi/agent/mcp.json", mode = "symlink" }
"~/Dev/local/.pi/extensions/pi-footer.json" = { source = "config/.pi/agent/extensions/pi-footer.json", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "config/.config/mise/config.base.toml", mode = "symlink" }
"~/.config/karabiner" = { source = "config/.config/karabiner", mode = "symlink" }
"~/.gemini/antigravity-cli/skills" = { source = "~/.agents/skills", mode = "symlink" }
