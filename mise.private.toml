# This profile does not implicitly include default.

[dotfiles."~/.hermes"]
source = "config/.hermes"
mode = "symlink-each"
manifest = "git"

[dotfiles]
"~/.local/libexec/hermes" = { source = "config/.local/libexec/hermes", mode = "symlink" }
"~/.local/libexec/hermes-gui-launchctl/launchctl" = { source = "config/.local/libexec/hermes-gui-launchctl/launchctl", mode = "symlink" }
