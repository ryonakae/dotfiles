onboarding = false

[ui]
agent_panel_sort = "spaces"
pane_gaps = false
pane_scrollbars = false

[ui.sound]
enabled = false

[keys]
# 左 Option でペインを移動し、Shift 併用でタブとワークスペースを移動する
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
switch_workspace = "prefix+shift+1..9"

# worktree は worktrunk プラグイン経由で作る（本体の worktree は ~/.herdr/worktrees に
# フラット配置され、worktree-path テンプレートも hooks も効かない）。デフォルトの
# prefix+shift+g をプラグインへ明け渡すため、本体側を空にして無効化する。
new_worktree = ""

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

# prefix+shift+d は本体の close_workspace なので避ける
[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"
