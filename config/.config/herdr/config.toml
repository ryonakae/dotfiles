onboarding = false

[ui]
agent_panel_sort = "spaces"
pane_gaps = false
pane_scrollbars = false

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "agent", bold = true, dim = false }],
  [{ token = "workspace", bold = false, dim = true }, "tab", "pane"],
  ["$agent_context_session_name"],
  ["$agent_context_last_message"],
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[keys]
# 左 Option と hjkl でペイン・タブ、矢印でエージェント・ワークスペースを移動する
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
previous_workspace = "alt+shift+up"
next_workspace = "alt+shift+down"
previous_agent = "alt+up"
next_agent = "alt+down"
switch_workspace = "prefix+shift+1..9"

# worktree は worktrunk プラグイン経由で作る（本体の worktree は ~/.herdr/worktrees に
# フラット配置され、worktree-path テンプレートも hooks も効かない）。デフォルトの
# prefix+shift+g をプラグインへ明け渡すため、本体側を空にして無効化する。
new_worktree = ""

[[keys.command]]
key = "alt+h"
type = "shell"
command = "sh \"$HOME/.config/herdr/scripts/focus-pane-or-tab.sh\" left"
description = "Focus left pane or previous tab"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "sh \"$HOME/.config/herdr/scripts/focus-pane-or-tab.sh\" right"
description = "Focus right pane or next tab"

[[keys.command]]
key = "prefix+y"
type = "shell"
command = "uv run \"$HOME/.config/herdr/scripts/normalize-clipboard.py\" && \"$HERDR_BIN_PATH\" notification show \"Clipboard normalized\" --position bottom-right"
description = "Normalize wrapped clipboard text"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

# prefix+shift+d は本体の close_workspace なので避ける
[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+z"
type = "plugin_action"
command = "zerdr.open-zed"
description = "Open workspace in Zed"
